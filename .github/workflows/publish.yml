name: Build, encrypt and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check password is set
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "SITE_PASSWORD secret is not set. Refusing to publish an unprotected site."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Encrypt pages
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          sudo chown -R "$(id -u)" _site
          npx -y staticrypt@3 _site -r -d encrypted \
            -p "$SITE_PASSWORD" --short -c false \
            --salt 31832c3ef9f7b90a45e01d6021d9ef87 \
            --remember 30 \
            --template-title "ޖަމްޢިއްޔަތުއް ސަލަފް" \
            --template-instructions "ވަދެލުމަށް ޕާސްވޯޑް ޖައްސަވާ" \
            --template-placeholder "ޕާސްވޯޑް" \
            --template-button "ވަދެލާ" \
            --template-remember "މަތިން ހަނދާން ބަހައްޓާ" \
            --template-error "ޕާސްވޯޑް ރަނގަޅެއް ނޫން" \
            --template-color-primary "#1f7a35" \
            --template-color-secondary "#fbf8f3"
          # Make sure no readable page slipped through
          for f in $(find encrypted/_site -name '*.html'); do
            grep -q staticrypt "$f" || { echo "Not encrypted: $f"; exit 1; }
          done

      - name: Publish to public site repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: Jamiyyath-Salaf/rihla.salaf
          publish_branch: main
          publish_dir: ./encrypted/_site
          commit_message: Publish encrypted site
