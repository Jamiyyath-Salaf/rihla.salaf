<!doctype html>
<html lang="dv" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f7a35">
<title>ރިޙްލާގެ ރިވިއު · ސަލަފް ރިޙްލާ 2026</title>
<link rel="icon" href="../assets/logo.png">
<style>
@font-face { font-family: "MV Funa"; src: url("../assets/fonts/mvfuna-regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "MV Funa"; src: url("../assets/fonts/mvfuna-bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "MV Funa"; src: url("../assets/fonts/mvfuna-black.ttf") format("truetype"); font-weight: 900; font-display: swap; }
:root {
  color-scheme: light;
  --bg: #f4f1ea; --surface: #fff; --text: #1f2a24; --muted: #5c6b62; --line: #e3dccf;
  --accent: #1f7a35; --accent-dark: #145426; --accent-soft: #e6f2e9; --warm: #c8743a; --star: #f2a516; --danger: #b3261e; --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 17px/1.75 "MV Funa", Faruma, system-ui, sans-serif; min-height: 100vh; }
button, input { font: inherit; color: inherit; }
.num { font-family: "Helvetica Neue", Arial, system-ui, sans-serif; direction: ltr; unicode-bidi: isolate; }

.top { background: linear-gradient(160deg, #1f7a35 0%, #145426 100%); color: #fff; padding: 14px 16px 54px; position: relative; overflow: hidden; }
.top::after { content: ""; position: absolute; inset: auto -10% -60px -10%; height: 110px; background: var(--bg); border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
.brand { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
.logo { background: #fff; border-radius: 14px; padding: 6px; height: 72px; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.logo img { height: 60px; width: auto; display: block; }
.ttl { text-align: center; flex: 1; min-width: 0; }
.ttl h1 { margin: 0; font-weight: 900; font-size: 22px; line-height: 1.45; }
.ttl p { margin: 0; font-size: 13.5px; opacity: .85; }

main { max-width: 560px; margin: -34px auto 0; padding: 0 16px 40px; position: relative; z-index: 2; }
.note { background: #fff8e1; border: 1px solid #ecd58a; color: #6b5200; border-radius: 12px; padding: 6px 12px; font-size: 13.5px; margin-bottom: 12px; text-align: center; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 0 0 1px var(--line) inset; padding: 16px; margin-bottom: 12px; }
h2 { font-weight: 900; font-size: 19px; margin: 0 2px 10px; line-height: 1.5; display: flex; align-items: center; gap: 8px; }
h2 .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 14px/1 Arial, sans-serif; }
.guide { margin: -4px 2px 10px; background: var(--accent-soft); color: var(--accent-dark); border-radius: 12px; padding: 8px 12px; font-size: 15px; line-height: 1.8; font-weight: 700; }
.hint { color: var(--muted); font-size: 14px; margin: -6px 2px 10px; }
.intro { text-align: center; color: var(--muted); font-size: 15px; margin: 0 4px 12px; }

/* who */
.roles { display: grid; gap: 8px; }
.role { border: 0; background: #fdfcf9; border-radius: 14px; padding: 11px 14px; text-align: right; display: flex; align-items: center; gap: 12px; box-shadow: 0 0 0 1.5px var(--line) inset; cursor: pointer; font-weight: 700; font-size: 16.5px; line-height: 1.5; transition: box-shadow .12s, background .12s; }
.role i { flex: none; width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 2px #cfc6b5 inset; display: grid; place-items: center; }
.role[aria-checked="true"] { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent) inset; color: var(--accent-dark); }
.role[aria-checked="true"] i { box-shadow: none; background: var(--accent); }
.role[aria-checked="true"] i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }

/* stars */
.stars { display: flex; justify-content: center; gap: 6px; }
.star { border: 0; background: none; padding: 2px; cursor: pointer; width: 54px; height: 54px; color: #ddd5c4; transition: transform .1s, color .1s; }
.star svg { width: 100%; height: 100%; display: block; }
.star.on { color: var(--star); }
.star:active { transform: scale(.9); }
.rlabel { text-align: center; font-weight: 700; color: var(--muted); min-height: 1.75em; margin-top: 4px; }
.rlabel.set { color: #a46a00; }
.locked { opacity: .45; pointer-events: none; }
.next { width: 100%; margin-top: 4px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 900; font-size: 19px; padding: 10px 0; box-shadow: 0 4px 12px rgba(31,122,53,.3); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.next svg { width: 20px; height: 20px; }
.next:disabled { background: #b9c9bd; box-shadow: none; cursor: default; }
.chosen { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); border-radius: 14px; padding: 8px 14px; margin-bottom: 12px; box-shadow: 0 0 0 1.5px #bfdcc6 inset; }
.chosen small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.chosen b { color: var(--accent-dark); font-size: 16.5px; }
.chg { flex: none; border: 0; background: #fff; color: var(--accent-dark); border-radius: 999px; padding: 3px 14px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 0 0 1px #bfdcc6 inset; }
.step2 { animation: slide .25s ease; }
@keyframes slide { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
[hidden] { display: none !important; }

/* points */
.pts { list-style: none; margin: 0; padding: 0; counter-reset: pt; }
.pts li { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; counter-increment: pt; }
.pts li::before { margin-top: 9px; content: counter(pt); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-dark); display: grid; place-items: center; font: 700 14px/1 Arial, sans-serif; }
.pts textarea { display: block; resize: none; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 46px; flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: #fdfcf9; padding: 8px 12px; font-size: 16px; line-height: 1.8; }
.pts textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pts .del { margin-top: 6px; flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #f1ede4; color: var(--muted); font: 700 20px/1 Arial, sans-serif; cursor: pointer; }
.addpt { border: 1.5px dashed var(--accent); background: transparent; color: var(--accent-dark); border-radius: 999px; padding: 3px 16px; font-weight: 700; font-size: 15px; cursor: pointer; }

.err { color: var(--danger); font-size: 14px; margin: 4px 2px 0; min-height: 1em; text-align: center; }
.send { width: 100%; margin-top: 6px; border: 0; border-radius: 999px; background: var(--warm); color: #fff; font-weight: 900; font-size: 19px; padding: 10px 0; box-shadow: 0 4px 12px rgba(200,116,58,.35); cursor: pointer; }
.send:active { transform: translateY(1px); }

.done-box { text-align: center; padding: 26px 16px 18px; }
.tick { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 0 auto 10px; box-shadow: 0 6px 18px rgba(31,122,53,.35); animation: pop .35s ease; }
.tick svg { width: 40px; height: 40px; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.done-box h2 { justify-content: center; margin: 0; }
.done-stars { color: var(--star); font-size: 28px; letter-spacing: 4px; margin-top: 6px; }
.ghost { width: 100%; margin-top: 12px; border: 0; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; font-size: 17px; padding: 9px 0; cursor: pointer; }
footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 18px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><img src="../assets/logo.png" alt="ޖަމްޢިއްޔަތުއް ސަލަފް"></div>
    <div class="ttl"><h1>ރިޙްލާގެ ރިވިއު</h1><p>ސަލަފް ރިޙްލާ 2026 · ބ. އަތޮޅު</p></div>
    <div class="logo"><img src="../assets/rihla-logo.png" alt="ސަލަފް ރިޙްލާ 2026"></div>
  </div>
</header>
<main id="app"></main>

<script>
(function () {
  // Same Google Apps Script web app as the attendance page. Reviews are stored with type "review".
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbwLJje9h1cPook0x-FQWjeuNhb9AjaO4nhZDAV21V-oBrO-JpCLt0cbDgQhgPu3lorheA/exec';
  var QKEY = 'rihla-review-queue';
  var ROLES = ['ކައުންސިލް / ރަށުގެ ފޯކަލް', 'ސްކޫލު ފަރާތުން', 'ރިޙްލާގެ ފެސިލިޓޭޓަރެއް', 'ރިޙްލާގެ އެހީތެރިއެއް'];
  var LABELS = ['', 'ރަނގަޅު ނޫން', 'މައިގަނޑު ރަނގަޅު', 'ރަނގަޅު', 'ވަރަށް ރަނގަޅު', 'މޮޅު'];
  var app = document.getElementById('app');
  var role = -1, rating = 0, last = null;
  var starSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8z"/></svg>';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function queue() { try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch (e) { return []; } }
  function setQueue(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }

  var sending = false, onSent = null;
  function flush() {
    if (sending || !navigator.onLine) return;
    var q = queue(); if (!q.length) return;
    sending = true;
    fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(q[0]) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error('bad'); setQueue(queue().filter(function (x) { return x.id !== q[0].id; })); sending = false; if (onSent) onSent(); flush(); })
      .catch(function () { sending = false; });
  }

  function form() {
    role = -1; rating = 0;
    var pending = queue().length;
    app.innerHTML = (pending ? '<div class="note">ފޮނުވަން ހުރި ރިވިއު: <span class="num">' + pending + '</span> · އިންޓަނެޓް ލިބުމުން އަމިއްލައަށް ފޮނުވޭނެ</div>' : '') +
      '' +
      '<form id="f" novalidate><div id="s1">' +
      '<div class="card"><p class="hint" style="margin:0 2px 8px">ސަލަފް ރިޙްލާ 2026 އާ ބެހޭގޮތުން ތިބާގެ ޚިޔާލު ހިއްސާކުރައްވާ</p><h2><span class="n">1</span>ތިބާއަކީ</h2><div class="roles" role="radiogroup">' +
        ROLES.map(function (r, i) { return '<button type="button" class="role" role="radio" aria-checked="false" data-role="' + i + '"><i></i>' + esc(r) + '</button>'; }).join('') +
      '</div></div><button type="button" class="next" id="nx" disabled>ކުރިއަށް <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button></div>' +
      '<div id="s2" class="step2" hidden><div class="chosen"><div><small>ތިބާއަކީ</small><b id="rn"></b></div><button type="button" class="chg" data-back="1">ބަދަލުކުރޭ</button></div>' +
      '<div class="card" id="rate"><h2><span class="n">2</span>ރިޙްލާއަށް ދެއްވާ ރޭޓިންގ</h2>' +
        '<div class="stars" role="radiogroup">' + [1, 2, 3, 4, 5].map(function (k) { return '<button type="button" class="star" role="radio" aria-checked="false" aria-label="' + k + '" data-star="' + k + '">' + starSvg + '</button>'; }).join('') + '</div>' +
        '<div class="rlabel" id="rl">ތަރި ހޮއްވަވާ</div></div>' +
      '<div class="card" id="pc"><h2><span class="n">3</span>ޚިޔާލު ހުށައަޅުއްވާ</h2><p class="guide">ރިޙްލާގެ އިދާރީ ކަންކަމާއި، ރިޙްލާގައި ކުރިއަށް ގެންދެވުނު ޙަރަކާތްތަކާއި، ޙަރަކާތްތައް ކުރިއަށް ގެންދެވުނު ގޮތާ މެދު ޚިޔާލު ހުށައަޅުއްވާ!</p><p class="hint">ކޮންމެ ނުކުތާއެއް ވަކިން ލިޔުއްވާ · ލާޒިމެއް ނޫން</p>' +
        '<ol class="pts" id="pts"></ol><button type="button" class="addpt" data-pt="add">+ ނުކުތާއެއް އިތުރުކުރޭ</button></div>' +
      '<div class="err" id="err"></div><button class="send" type="submit">ފޮނުވާ</button></div></form>' +
      '<footer>ޖަމްޢިއްޔަތުއް ސަލަފް</footer>';
    addPoint('');
    window.scrollTo(0, 0);
  }

  function done(waiting) {
    app.innerHTML = '<div class="card done-box"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
      '<h2>' + (waiting ? 'ފޯނުގައި ރައްކާކުރެވިއްޖެ' : 'ޝުކުރިއްޔާ!') + '</h2>' +
      '<p class="hint" style="margin:4px 0 0">' + (waiting ? 'އިންޓަނެޓް ލިބުމުން އަމިއްލައަށް ފޮނުވޭނެ' : 'ތިބާގެ ރިވިއު ލިބިއްޖެ') + '</p>' +
      '<div class="done-stars">' + '★★★★★'.slice(0, last.rating) + '<span style="color:#ddd5c4">' + '★★★★★'.slice(last.rating) + '</span></div>' +
      '<p class="hint" style="margin:0">' + esc(last.role) + '</p>' +
      '<button class="ghost" data-again="1">އިތުރު ރިވިއުއެއް ފޮނުވާ</button></div><footer>ޖަމްޢިއްޔަތުއް ސަލަފް</footer>';
    onSent = function () { if (document.querySelector('.done-box') && !queue().length) done(false); };
    window.scrollTo(0, 0);
  }

  function setStars(k) {
    rating = k;
    Array.prototype.forEach.call(document.querySelectorAll('.star'), function (s) { var v = +s.getAttribute('data-star'); s.classList.toggle('on', v <= k); s.setAttribute('aria-checked', v === k ? 'true' : 'false'); });
    var rl = document.getElementById('rl'); rl.innerHTML = '<span class="num">' + k + '/5</span> · ' + LABELS[k]; rl.classList.add('set');
    document.getElementById('err').textContent = '';
  }

  function addPoint(val, after, focus) {
    var ol = document.getElementById('pts'); if (!ol) return;
    var li = document.createElement('li');
    li.innerHTML = '<textarea rows="1" dir="auto" autocomplete="off" maxlength="500"></textarea><button type="button" class="del" data-pt="del" aria-label="ފޮހެލާ">×</button>';
    li.querySelector('textarea').value = val || ''; grow(li.querySelector('textarea'));
    if (after && after.nextSibling) ol.insertBefore(li, after.nextSibling); else ol.appendChild(li);
    if (focus) li.querySelector('textarea').focus();
  }
  // Each point box grows downward as the text wraps, so the whole point stays visible
  function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
  function points() {
    return Array.prototype.map.call(document.querySelectorAll('#pts textarea'), function (x) { return x.value.replace(/\s+/g, ' ').trim(); })
      .filter(function (x) { return x; }).join('\n');
  }

  app.addEventListener('input', function (ev) { if (ev.target.matches('#pts textarea')) grow(ev.target); });
  window.addEventListener('resize', function () { Array.prototype.forEach.call(document.querySelectorAll('#pts textarea'), grow); });
  app.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.matches('#pts textarea')) { ev.preventDefault(); if (ev.target.value.trim()) addPoint('', ev.target.parentNode, true); }
  });
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-role]');
    if (b) {
      role = +b.getAttribute('data-role');
      Array.prototype.forEach.call(document.querySelectorAll('.role'), function (x) { x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
      document.getElementById('nx').disabled = false;
      document.getElementById('err').textContent = '';
      return;
    }
    var s = ev.target.closest('[data-star]'); if (s) { setStars(+s.getAttribute('data-star')); return; }
    var pt = ev.target.closest('[data-pt]');
    if (pt) {
      if (pt.getAttribute('data-pt') === 'add') {
        var empty = Array.prototype.filter.call(document.querySelectorAll('#pts textarea'), function (x) { return !x.value.trim(); })[0];
        if (empty) empty.focus(); else addPoint('', null, true);
      } else { var li = pt.parentNode, ol = li.parentNode; ol.removeChild(li); if (!ol.children.length) addPoint(''); }
      return;
    }
    if (ev.target.closest('#nx') && role >= 0) { document.getElementById('rn').textContent = ROLES[role]; document.getElementById('s1').hidden = true; document.getElementById('s2').hidden = false; window.scrollTo(0, 0); return; }
    if (ev.target.closest('[data-back]')) { document.getElementById('s2').hidden = true; document.getElementById('s1').hidden = false; window.scrollTo(0, 0); return; }
    if (ev.target.closest('[data-again]')) form();
  });
  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var err = document.getElementById('err');
    if (role < 0) { err.textContent = 'ތިބާއަކީ ކާކުކަން ހޮއްވަވާ'; return; }
    if (!rating) { err.textContent = 'ތަރި ހޮއްވަވާ'; return; }
    var at = new Date().toISOString();
    last = { id: at + '-rv' + Math.random().toString(36).slice(2, 8), at: at, island: 'ރިވިއު', day: 'ރިވިއު', time: '', activity: ROLES[role], by: '', type: 'review',
      role: ROLES[role], rating: rating, men: rating, women: 0, total: rating, suggestion: points(), volunteer: '' };
    setQueue(queue().concat([last]));
    done(true);
    flush();
  });

  window.addEventListener('online', flush);
  setInterval(flush, 30000);
  form();
  flush();
})();
</script>
</body>
</html>
