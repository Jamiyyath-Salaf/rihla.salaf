title: ޖަމްޢިއްޔަތުއް ސަލަފް
logo: assets/logo.png

# Dhivehi month names, used for dates
months: [ޖަނަވަރީ, ފެބްރުއަރީ, މާރިޗު, އޭޕްރީލް, މެއި, ޖޫން, ޖުލައި, އޮގަސްޓު, ސެޕްޓެމްބަރު, އޮކްޓޫބަރު, ނޮވެމްބަރު, ޑިސެމްބަރު]

collections:
  events:
    output: true
    permalink: /events/:name/

defaults:
  - scope:
      type: events
    values:
      layout: event

future: true
exclude: [README.md]
