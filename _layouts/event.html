---
layout: default
---
<div class="container event">
  <a href="{{ '/' | relative_url }}" class="back">→ {{ site.title }}</a>
  <h1>{{ page.title }}</h1>
  <p class="event-sub">{% if page.location %}{{ page.location }} · {% endif %}{% include daterange.html start=page.date end=page.end_date %}</p>
  <div class="updates">
    {{ content }}
  </div>
</div>
